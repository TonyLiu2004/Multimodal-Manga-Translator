name: Backend tests + DB query check

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd backend
          pip install -r requirements.txt
          # Verify Supabase DB is reachable and has data
          python -m db.test_functions.query_data
          # Run integration tests
          python -m unittest db.test_db -v
