name: Supabase connectivity check

on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: '0 * * * *'     # optional: hourly check

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    continue-on-error: true        # non-blocking: failures won't break PRs/main CI

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Supabase query_data check
        run: |
          cd backend
          python -m db.test_functions.query_data

